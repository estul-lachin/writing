name: New post
description: Write a post for uig.me/writing. Label it "check" to test it, "publish" to publish it.
title: "Post title"
body:
  - type: markdown
    attributes:
      value: |
        **An issue is public the moment you save it, and so is every picture pasted into it.**
        Write defanged from the start: `198[.]51[.]100[.]7`, `hxxp[:]//`. Only pseudonymized data (`src-xxxxxxxx`).
        No honeypot server addresses, no Azure IDs, nothing from an employer or a client.

        The issue title is the post title. When you are done, add the label **check** to test it,
        then **publish**. The label is removed again when the run ends.
  - type: input
    id: slug
    attributes:
      label: Short name
      description: Lowercase, hyphens. It becomes the address, e.g. inc-002 gives uig.me/writing/inc-002/.
      placeholder: inc-002
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - note
        - investigation
        - incident
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: One-line summary
      description: Shown in the lists and in link previews.
    validations:
      required: true
  - type: input
    id: techniques
    attributes:
      label: ATT&CK techniques (optional)
      description: Comma separated.
      placeholder: T1110.001, T1105
  - type: dropdown
    id: tool
    attributes:
      label: Main tool (optional)
      options:
        - none
        - splunk
        - sentinel
        - wazuh
  - type: textarea
    id: body
    attributes:
      label: Post (Markdown)
      description: Paste screenshots straight into this box.
    validations:
      required: true
